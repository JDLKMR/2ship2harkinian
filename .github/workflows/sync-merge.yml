name: Sync mouse + AP branches

on:
  schedule:
    - cron: '0 13 * * *'   # daily at 13:00 UTC -- adjust to taste
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ap-mouse-merge
        uses: actions/checkout@v4
        with:
          ref: ap-mouse-merge
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git identity + rerere
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled true
          git config rerere.autoUpdate true

      - name: Restore rerere resolutions
        uses: actions/cache@v4
        with:
          path: .git/rr-cache
          key: rerere-${{ github.run_id }}
          restore-keys: rerere-

      - name: Add upstream remotes and fetch
        run: |
          git remote add ap https://github.com/garrettjoecox/2ship2harkinian.git || true
          git remote add lightman https://github.com/lightmanLP/2ship2harkinian.git || true
          git fetch ap 2Ship-AP
          git fetch lightman feat/mouse-support

      - name: Merge AP branch
        run: |
          if ! git merge ap/2Ship-AP --no-edit; then
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved conflicts merging ap/2Ship-AP -- needs a human:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

      - name: Merge mouse-support branch
        run: |
          if ! git merge lightman/feat/mouse-support --no-edit; then
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "::error::Unresolved conflicts merging lightman/feat/mouse-support -- needs a human:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

      - name: Push (also triggers your existing build workflow)
        run: git push origin ap-mouse-merge
